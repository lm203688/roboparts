<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 场景 ----------
let scene, camera, renderer, controls, mesh, curGroup;
const el = document.getElementById('viewer');
function initScene(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, el.clientWidth/el.clientHeight, 0.1, 4000);
  camera.position.set(180,150,220);
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(el.clientWidth, el.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  el.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff,0.65));
  const d=new THREE.DirectionalLight(0xffffff,0.9); d.position.set(140,220,160); scene.add(d);
  const d2=new THREE.DirectionalLight(0x88aaff,0.4); d2.position.set(-160,-110,-130); scene.add(d2);
  window.addEventListener('resize',()=>{camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight);});
  animate();
}
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }

const matBody = new THREE.MeshStandardMaterial({color:0x3a465f, metalness:0.4, roughness:0.55});
function M(color){ return new THREE.MeshStandardMaterial({color, metalness:0.4, roughness:0.5}); }
function boltCircle(mat, pcd, n, r, depth){
  const g = new THREE.Group();
  for(let i=0;i<n;i++){
    const a=i*Math.PI*2/n;
    const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r,depth,20), mat);
    b.position.set(pcd/2*Math.cos(a), pcd/2*Math.sin(a), 0);
    g.add(b);
  }
  return g;
}

// ---------- 零件几何 ----------
function partFlange(p){ // ISO 9409-1 型式A
  const g=new THREE.Group();
  const t=12, R=p.pcd/2+18;
  const plate=new THREE.Mesh(new THREE.CylinderGeometry(R,R,t,96), M(0x37e0a6));
  plate.rotation.x=Math.PI/2; plate.position.z=0; g.add(plate);
  const holes=boltCircle(M(0x0b1020), p.pcd, p.holes, p.clr/2, t+2);
  g.add(holes);
  if(p.pins){ const pins=boltCircle(M(0x0b1020), p.pinPCD, 2, p.pinD/2, t+2); g.add(pins); }
  const bore=new THREE.Mesh(new THREE.CylinderGeometry(p.bore/2,p.bore/2,t+2,40), M(0x0b1020));
  bore.rotation.x=Math.PI/2; g.add(bore);
  g.userData.dim = `外径 Ø${(R*2).toFixed(0)} · PCD Ø${p.pcd} · ${p.holes}×${p.thread}${p.pins?' · 2×pinφ'+p.pinD:''} · 中心孔 Ø${p.bore}`;
  return g;
}
function partActuator(){ // DYNAMIXEL 风格执行器
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(28,28,52,48), M(0x5b9dff));
  body.rotation.x=Math.PI/2; g.add(body);
  const flange=new THREE.Mesh(new THREE.CylinderGeometry(36,36,6,48), M(0x2c3650));
  flange.rotation.x=Math.PI/2; flange.position.z=29; g.add(flange);
  const h=boltCircle(M(0x0b1020), 52, 4, 2.2, 10); h.position.z=29; g.add(h);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(8,8,16,32), M(0x9fb3d6));
  shaft.rotation.x=Math.PI/2; shaft.position.z=38; g.add(shaft);
  g.userData.dim = `外径 Ø56 · 长 68 · 法兰 PCD Ø52 4×M3 · 输出轴 Ø16 · 典型扭矩 5–20 Nm（示意）`;
  return g;
}
function partSensor(){
  const g=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(40,30,20), M(0x9b8cff)); g.add(box);
  const lens=new THREE.Mesh(new THREE.CylinderGeometry(7,7,6,32), M(0x0b1020)); lens.rotation.x=Math.PI/2; lens.position.z=11; g.add(lens);
  const tab=new THREE.Mesh(new THREE.BoxGeometry(8,6,24), M(0x2c3650)); tab.position.set(20,0,0); g.add(tab);
  g.userData.dim = `外壳 40×30×20 · 镜头 Ø14 · 安装耳 2×M2 · 量程示意 ±5 m`;
  return g;
}
function partController(){
  const g=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(70,50,22), M(0x37e0a6)); g.add(box);
  for(let i=0;i<6;i++){ const f=new THREE.Mesh(new THREE.BoxGeometry(2,40,24), M(0x2c3650)); f.position.set(-28+i*11,0,11.5); g.add(f); }
  g.userData.dim = `70×50×22 · 铝鳍散热 · 4×M3 安装 · 典型算力 1–4 TOPS（示意）`;
  return g;
}

// ---------- 零件清单 ----------
const PARTS = [
  {id:'flange-a50', name:'ISO 9409-1 法兰 · A50-4-M6', sub:'机器人腕部标准接口', build:()=>partFlange({pcd:50,holes:4,thread:'M6',clr:6.5,pins:2,pinPCD:22,bore:14}), tag:'flange', link:'/iso-9409-flange'},
  {id:'flange-a80', name:'ISO 9409-1 法兰 · A80-6-M8', sub:'最常用中等负载接口', build:()=>partFlange({pcd:80,holes:6,thread:'M8',clr:8.5,pins:2,pinPCD:38,bore:20}), tag:'flange', link:'/iso-9409-flange'},
  {id:'flange-a100', name:'ISO 9409-1 法兰 · A100-6-M10', sub:'重载接口', build:()=>partFlange({pcd:100,holes:6,thread:'M10',clr:10.5,pins:2,pinPCD:50,bore:30}), tag:'flange', link:'/iso-9409-flange'},
  {id:'flange-a160', name:'ISO 9409-1 法兰 · A160-8-M16', sub:'大型工业机器人', build:()=>partFlange({pcd:160,holes:8,thread:'M16',clr:12.5,pins:0,pinPCD:0,bore:50}), tag:'flange', link:'/iso-9409-flange'},
  {id:'actuator', name:'执行器（DYNAMIXEL 风格）', sub:'旋转模组示意', build:partActuator, tag:'actuator', link:'/selection'},
  {id:'sensor', name:'深度/视觉传感器', sub:'感知模组示意', build:partSensor, tag:'sensor', link:'/selection'},
  {id:'controller', name:'边缘控制器', sub:'算力模组示意', build:partController, tag:'controller', link:'/selection'},
];

function renderList(){
  const l=document.getElementById('list');
  PARTS.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='item'+(i===0?' on':''); d.dataset.id=p.id;
    d.innerHTML=`<div>${p.name}</div><div class="sub">${p.sub}</div>`;
    d.onclick=()=>selectPart(p.id);
    l.appendChild(d);
  });
}
function selectPart(id){
  const p=PARTS.find(x=>x.id===id); if(!p) return;
  document.querySelectorAll('.list .item').forEach(e=>e.classList.toggle('on', e.dataset.id===id));
  if(curGroup){ scene.remove(curGroup); }
  curGroup=p.build();
  // 居中
  const box=new THREE.Box3().setFromObject(curGroup); const c=box.getCenter(new THREE.Vector3()); curGroup.position.sub(c);
  scene.add(curGroup);
  const size=box.getSize(new THREE.Vector3()); const md=Math.max(size.x,size.y,size.z)||100;
  camera.position.set(md*0.9, md*0.8, md*1.2); controls.target.set(0,0,0);
  document.getElementById('spec').innerHTML =
    `<h3>${p.name}</h3><table>
      <tr><td>类别</td><td><span class="tag">${p.tag}</span></td></tr>
      <tr><td>关键尺寸</td><td>${curGroup.userData.dim||'—'}</td></tr>
      <tr><td>渲染方式</td><td>参数化 three.js（开源算法，非厂商 CAD）</td></tr>
    </table>
    <a class="btn" href="${p.link}">查看兼容性 / 选型 →</a>`;
}

initScene(); renderList(); selectPart('flange-a80');
</script>
</body>
