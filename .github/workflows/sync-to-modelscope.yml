# RoboParts Dataset: GitHub -> ModelScope (魔搭社区) 自动同步
# ModelScope 是国内可访问的 HuggingFace 替代平台
# 触发: push main 分支 (尤其 data/ 变更) 或手动触发
# 依赖: MODELSCOPE_TOKEN secret (ModelScope SDK 令牌)
#
# 设置说明:
#   1. 访问 https://www.modelscope.cn 注册账号 (国内可直接访问)
#   2. 进入 个人中心 -> 访问令牌 -> 创建令牌 (SDK 令牌)
#   3. 在 GitHub 仓库 Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: MODELSCOPE_TOKEN  Value: <你的ModelScope令牌>
#   4. 推送代码或手动触发本工作流即可自动同步

name: Sync to ModelScope Hub

on:
  push:
    branches: [main]
    paths:
      - 'roboparts-dataset-github/data/**'
      - 'roboparts-dataset-github/huggingface_dataset_card.md'
      - 'roboparts-dataset-github/README.md'
  workflow_dispatch:
    inputs:
      commit_message:
        description: '自定义提交消息 (留空则自动生成)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync-to-modelscope:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 准备数据集目录
      - name: Prepare dataset
        run: |
          mkdir -p ms-dataset/data ms-dataset/examples ms-dataset/python-sdk/roboparts ms-dataset/python-sdk/examples
          cp -r roboparts-dataset-github/data/* ms-dataset/data/
          cp roboparts-dataset-github/huggingface_dataset_card.md ms-dataset/README.md
          cp roboparts-dataset-github/LICENSE ms-dataset/ 2>/dev/null || true
          cp roboparts-dataset-github/examples/*.py ms-dataset/examples/ 2>/dev/null || true
          cp roboparts-dataset-github/python-sdk/README.md ms-dataset/python-sdk/ 2>/dev/null || true
          cp roboparts-dataset-github/python-sdk/setup.py ms-dataset/python-sdk/ 2>/dev/null || true
          cp roboparts-dataset-github/python-sdk/roboparts/*.py ms-dataset/python-sdk/roboparts/ 2>/dev/null || true
          cp roboparts-dataset-github/python-sdk/examples/*.py ms-dataset/python-sdk/examples/ 2>/dev/null || true

      # 3. 生成变更摘要
      - name: Generate change summary
        id: changes
        run: |
          if [[ -n "${{ inputs.commit_message }}" ]]; then
            echo "summary=${{ inputs.commit_message }}" >> "$GITHUB_OUTPUT"
            echo "commit_msg=${{ inputs.commit_message }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            MSG="sync from GitHub ${SHORT_SHA}: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "summary=${MSG}" >> "$GITHUB_OUTPUT"
            echo "commit_msg=${MSG}" >> "$GITHUB_OUTPUT"
          fi

      # 4. 同步到 ModelScope
      - name: Push to ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          pip install modelscope
          python -c "
          from modelscope.hub.api import HubApi
          import os

          api = HubApi(token=os.environ['MODELSCOPE_TOKEN'])

          namespace = 'lm203688'
          dataset_name = 'roboparts-data'

          # Create dataset if not exists (visibility=5 for public)
          try:
              api.create_dataset(
                  dataset_name=dataset_name,
                  namespace=namespace,
                  chinese_name='仿生机器人配件数据库',
                  license='CC-BY-4.0',
                  visibility=5,
                  description='Structured dataset of bionic robot components: 492 entities across 10 categories (actuators, sensors, chips, protocols, interfaces, LLMs, platforms, robot AI models, flexible actuators, data acquisition devices)'
              )
              print(f'Created dataset: {namespace}/{dataset_name}')
          except Exception as e:
              print(f'Dataset may already exist: {e}')

          # Upload files
          import glob
          for filepath in glob.glob('ms-dataset/**/*', recursive=True):
              if os.path.isfile(filepath):
                  rel_path = filepath.replace('ms-dataset/', '').replace('ms-dataset\\\\', '')
                  print(f'Uploading {rel_path}...')
                  api.upload_file(
                      path_or_fileobj=filepath,
                      path_in_repo=rel_path,
                      repo_id=f'{namespace}/{dataset_name}',
                      repo_type='dataset'
                  )
                  print(f'  Uploaded {rel_path}')

          print(f'Successfully synced to https://www.modelscope.cn/datasets/{namespace}/{dataset_name}')
          "

      # 5. 同步完成通知
      - name: Sync summary
        run: |
          echo "## ModelScope Sync Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repo**: lm203688/roboparts-data" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Message**: ${{ steps.changes.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "View at: https://www.modelscope.cn/datasets/lm203688/roboparts-data" >> "$GITHUB_STEP_SUMMARY"
