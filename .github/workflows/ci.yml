# RoboParts CI 质量闸门
#
# 为什么需要：此前项目的全部质量校验（regression.py 1000+ 断言、schema 契约、
# 分发一致性）**只在本地手工执行**。任何人（含外部 PR）改数据或代码都能绕过，
# 而 Cloudflare Pages 会照常部署 —— 等于线上没有守门人。
#
# 边界（诚实说明）：本工作流跑的是 `scripts/ci_gate.py`，即「不依赖私有 ops/ 仓
# 的仓内可判定子集」。完整回归（含留痕/棘轮/日报纪律）仍需本地
# `python scripts/regression.py`，因为那些断言依赖 ops/（在 .gitignore 中）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 2026-10-11 P1 修复：批量 API 推送会在短时间内触发多次 push 事件，
  # cancel-in-progress=true 会把前序运行取消（近 30 次 CI 里 26 次 cancelled），
  # 导致 CI 绿灯不可信。改成 false 让每次推送都完整跑完。
  cancel-in-progress: false

jobs:
  gate:
    name: 质量闸门
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 无凭据泄漏闸门要跑 git ls-files

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 【2026-10-31】node 20 → 22.22.2，对齐 package.json engines (>=22.22.0) 与 .nvmrc。
          # 此前 CI 用 20 但 engines 要求 >=22.22.0，是版本不一致（报告 P1-31）。
          node-version: '22.22.2'

      - name: 安装依赖
        # 走 requirements-dev.txt（PyYAML 供「GitHub 配置 YAML 可解析」闸门使用；
        # Issue 模板 / workflow 写坏时 GitHub 是**静默失效**而非报错，必须自己校验）。
        # 与本地 bootstrap 共用一份清单，避免「本地红 / 线上绿」的假分歧。
        run: python -m pip install --quiet -r requirements-dev.txt

      # 【2026-11-03 修复】CI 红根因：gate job 此前缺「生成 training_dataset」步骤。
      # 站内 href 闸门（gate_href_targets_exist）检查 data-hub.html→/api/training_dataset.json，
      # 该文件 .gitignore 排除（设计派生物不入库、部署/CI 时生成）→ 文件不存在 → 恒红。
      # deploy.yml 的 gate job 已有此步骤（2026-11-02 修复），ci.yml 缺 → CI 与 deploy 结果分歧。
      # 修复：与 deploy.yml 对齐，加 Setup Node + 用 export_training_dataset.mjs 生成
      #（ESM 模块，必须 node 运行，见 regen_derived.py STEPS line 98）。
      - name: 生成 training_dataset（供 href 闸门检查）
        run: node scripts/export_training_dataset.mjs

      - name: 列出闸门清单
        run: python scripts/ci_gate.py --list

      - name: 跑质量闸门
        run: python scripts/ci_gate.py

      - name: 分发目录漂移诊断（失败时给可执行修复命令）
        if: failure()
        run: |
          echo "::group::分发目录漂移详情"
          python scripts/sync_dataset_dist.py --check || true
          echo "::endgroup::"
          echo "修复方式：本地运行 python scripts/sync_dataset_dist.py 后重新提交。"
          echo "该目录是 HuggingFace / ModelScope 的发布源，漂移会把错误数字发布出去。"
